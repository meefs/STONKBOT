[project]
name = "stonkbot"
version = "0.1.0"
description = "Bankr-style bot for StonkFun on Solana"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
  "click>=8.1",
]

[project.scripts]
stonkbot = "stonkbot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
