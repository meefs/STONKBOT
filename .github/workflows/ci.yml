name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Test
        # The suite never touches the network: StonkFun and Solana RPC are
        # stubbed, so this is safe to run on every PR.
        run: pytest tests/ -q

      - name: Check that dry-run is still the default
        # A regression here would mean a fresh deploy spends real SOL.
        run: |
          python - <<'PY'
          import os
          for key in list(os.environ):
              if key.startswith(("STONKBOT_", "AGENT_", "X_", "SOLANA_")):
                  del os.environ[key]
          from stonkbot.config import Settings
          settings = Settings(_env_file=None)
          assert settings.dry_run is True, "DRY_RUN must default to True"
          assert settings.agent_vault_key is None, "vault key must have no default"
          print("safe defaults confirmed")
          PY

  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files
        run: |
          set -euo pipefail
          if git ls-files -z | xargs -0 grep -lIE \
              '(BEGIN [A-Z ]*PRIVATE KEY|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,}|xox[baprs]-)' ; then
            echo "::error::possible secret material in tracked files"
            exit 1
          fi
          echo "no secret material found"

      - name: Reject populated secret variables
        run: |
          set -euo pipefail
          # .env.example must ship with these EMPTY.
          if git ls-files -z | xargs -0 grep -nIE \
              '(AGENT_VAULT_KEY|X_API_SECRET|X_ACCESS_TOKEN_SECRET|X_BEARER_TOKEN)[[:space:]]*=[[:space:]]*["'"'"']?[A-Za-z0-9_-]{12,}' ; then
            echo "::error::a secret variable appears to have a real value committed"
            exit 1
          fi
          echo "no populated secret variables"

      - name: Reject committed data directory
        run: |
          set -euo pipefail
          if git ls-files | grep -E '^data/|\.env$|\.db$' ; then
            echo "::error::runtime data or .env is tracked — the vault must never be committed"
            exit 1
          fi
          echo "no runtime data tracked"

  web:
    name: Static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Serverless function parses as ESM
        run: node --input-type=module -e "import('./api/live.mjs').then(m => { if (typeof m.default !== 'function') { throw new Error('no default export'); } console.log('api/live.mjs OK'); })"

      - name: Config files are valid JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json OK')"

      - name: Site makes no third-party requests
        # The CSP forbids external origins; this catches a stylesheet, script or
        # image sneaking in before it reaches production and breaks the page.
        run: |
          set -euo pipefail
          if grep -oE '(src|href)="https?://[^"]+"' web/*.html \
             | grep -vE 'stonkfunbot\.vercel\.app|x\.com/stonkfunbot|www\.stonkfun\.xyz' ; then
            echo "::error::web/ references an external resource the CSP will block"
            exit 1
          fi
          echo "no external resource references"
